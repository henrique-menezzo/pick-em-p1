<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;background:#0a0909;overflow:hidden}iframe{border:0;display:block}</style></head><body>
<script>
// Screenshot helper: loads the app at a true 1440 viewport inside an iframe, so headless Chrome
// can't scroll the page under us. ?q=… is forwarded to the app, ?h=… sets the capture height.
const p = new URLSearchParams(location.search);
const f = document.createElement('iframe');
f.width = 1440; f.height = p.get('h') || 1200;
f.src = '/?' + (p.get('q') || '');
document.body.appendChild(f);
</script></body></html>
